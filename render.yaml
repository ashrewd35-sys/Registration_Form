services:
  - type: web
    name: registration-form-thqc
    runtime: python
    plan: free
    rootDir: app/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://ashrewd35-sys.github.io
      - key: UPI_VPA
        value: information.tatasolar-1@okicici
      - key: UPI_PAYEE_NAME
        sync: false
      - key: UPI_PAYMENT_NOTE
        value: Channel Partner Application Fee
      - key: APPLICATION_FEE_INR
        value: "299"
      - key: ADMIN_PIN
        generateValue: true
